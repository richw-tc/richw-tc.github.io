<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9f6">
  <meta name="description" content="Academic homepage of Wang Tianchen.">
  <title>Wang Tianchen | Academic homepage</title>
  <link rel="icon" href="assets/monogram.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <span class="monogram" aria-hidden="true">WT</span>
      <a class="profile-link" href="https://github.com/Humorhaha">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.76-.24.76-.54v-2.07c-3.12.68-3.78-1.33-3.78-1.33-.51-1.29-1.25-1.63-1.25-1.63-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.49-.29-5.11-1.25-5.11-5.55 0-1.23.44-2.23 1.16-3.02-.12-.29-.5-1.43.11-2.97 0 0 .95-.3 3.08 1.15a10.71 10.71 0 0 1 5.6 0c2.14-1.45 3.08-1.15 3.08-1.15.61 1.54.23 2.68.12 2.97.72.79 1.15 1.79 1.15 3.02 0 4.31-2.62 5.26-5.12 5.54.4.35.76 1.03.76 2.08v3.06c0 .3.2.65.77.54A11.2 11.2 0 0 0 12 .8z"/>
        </svg>
        GitHub
      </a>
    </header>

    <main>
      <div class="hero">
        <div class="identity">
          <p class="kicker">Academic homepage</p>
          <h1>Wang <span>Tianchen</span></h1>
        </div>
        <div class="art" aria-hidden="true">
          <img src="assets/knot.webp" alt="" width="1003" height="1020">
        </div>
      </div>

      <!-- 在标题后添加简介段落，这个区块就会自动显示。 -->
      <section class="detail" id="research">
        <h2>Research</h2>
      </section>

      <!-- 在标题后添加论文条目，这个区块就会自动显示。 -->
      <section class="detail" id="publications">
        <h2>Publications</h2>
      </section>
    </main>

    <footer>© Wang Tianchen</footer>
  </div>
</body>
</html>
